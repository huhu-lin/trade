[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade"
version = "0.1.0"
description = "Mid-to-long-term value investing screener driven by fundamentals + supply/demand propagation, with evidence-bound Claude analysis."
requires-python = ">=3.11"
dependencies = [
    "FinMind>=1.6",
    "tqdm>=4.66",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "networkx>=3.2",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
trade = "trade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trade = ["report/templates/*.md.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
